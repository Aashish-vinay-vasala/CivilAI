apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: civilai
  labels:
    app: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: us-central1-docker.pkg.dev/gen-lang-client-0881995245/civilai/ml:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            # Read by ml/api/auth.py to validate Supabase JWTs on /train and
            # /data/upload — every other route (predict/gnn/mlops) is public.
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civilai-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: civilai-secrets
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: civilai
spec:
  selector:
    app: ml
  ports:
    - port: 80
      targetPort: 8001
  type: ClusterIP
