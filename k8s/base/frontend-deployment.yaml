apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: civilai
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/gen-lang-client-0881995245/civilai/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # No env here: this image is a static Next.js export (see frontend/Dockerfile),
          # so every NEXT_PUBLIC_* value is already compiled into the JS bundle at
          # `docker build` time via --build-arg (set in cloudbuild.yaml). Setting them
          # as container env vars here would be silently ignored.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civilai
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
