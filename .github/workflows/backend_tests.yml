name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_tests.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Deterministic tests only — no network calls, no API keys required.
      # This is the gate that must pass on every push/PR.
      - name: Run deterministic test suite
        run: python -m pytest test_guardrails.py test_judge.py test_grounding_eval.py -v

      # Golden-set regression for the grounding classifier (app/core/grounding.py)
      # — live Groq + DeepEval calls, so it only runs when GROQ_API_KEY is
      # configured as a repo secret. Catches a prompt/model change that
      # silently degrades hallucination detection; does not block the build
      # if the secret isn't set, since that's a live-call/cost opt-in.
      - name: Run grounding golden-set regression
        if: ${{ secrets.GROQ_API_KEY != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_INTEGRATION_EVALS: '1'
        run: python -m pytest test_grounding_eval.py -v -k GoldenSet
